name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app deps
        run: npm ci

      - name: Install functions deps
        run: npm ci --prefix functions

      - name: Build web app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATORS: '0'
        run: npm run build

      - name: Build functions
        run: npm run build --prefix functions

      - name: Write service account key
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # The web app itself — this must succeed.
      - name: Deploy Hosting
        run: npx firebase-tools deploy --only hosting --non-interactive

      # Rules & indexes — change rarely; don't block the app if perms lag.
      - name: Deploy Firestore & Storage rules
        run: npx firebase-tools deploy --only firestore,storage --non-interactive
        continue-on-error: true

      # Cloud Functions — only relevant once Shopify / email are wired up.
      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --non-interactive --force
        continue-on-error: true
